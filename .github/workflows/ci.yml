name: CI

on:
  push:
    branches: [main]   # branches with a PR are tested by pull_request: one run per commit, not two
  pull_request:
  workflow_dispatch:   # lock.yml re-runs CI after pushing a refreshed lock
  schedule:
    - cron: "17 5 * * 1"   # weekly: catches new advisories / upstream breakage

permissions:
  contents: read

concurrency:   # a newer push to the same PR cancels its obsolete run; every push to main gets its own run (no "cancelled" marks on main)
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock
      - name: System packages (Tesseract + Romanian data)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ron
      - name: Python dependencies (pinned like the server)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock   # every runtime dependency verified by hash
          pip install -r requirements-dev.txt -c requirements.lock   # test tools: pinned versions, no hashes
      - name: Playwright Chromium + Firefox + WebKit (browser tests run instead of skipping)
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Release consistency (VERSION / CHANGELOG RO+EN / CHARTS_V)
        run: python scripts/check_release.py
      - name: Tests
        run: python -m pytest -q

  gitleaks:
    # secret scan: full history on push/schedule, only the PR's own commits on pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -eu
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ -n "$BASE" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$BASE..$HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          fi

  bandit:
    # static security lint of app/ and scripts/: fails on medium+ severity with high confidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install bandit (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^bandit==' requirements-dev.txt)"
      - name: Bandit
        run: bandit -q -r app scripts -ll -iii

  supply-chain:
    # SBOM (CycloneDX) from the lock + known-vulnerability audit of the locked versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pip-audit and cyclonedx-bom (versions pinned in requirements-dev.txt)
        run: |
          grep -E '^(pip-audit|cyclonedx-bom)==' requirements-dev.txt > "$RUNNER_TEMP/tools.txt"
          pip install -r "$RUNNER_TEMP/tools.txt"
      - name: SBOM (CycloneDX JSON)
        run: cyclonedx-py requirements requirements.lock --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Dependency audit (fails on known vulnerabilities that have a fix)
        # To accept a finding, put its id in IGNORE with a one-line justification (and repeat it in the PR).
        # Vulnerabilities with no fixed version yet are only reported, not failed.
        env:
          IGNORE: ""   # e.g. "PYSEC-2026-1234"  (reason: not reachable, fix expected in X)
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip -f json -o audit.json || true
          python - <<'PY'
          import json, os, sys
          ignore = set(os.environ["IGNORE"].split())
          bad = []
          for d in json.load(open("audit.json"))["dependencies"]:
              for v in d.get("vulns", []):
                  if ignore & {v["id"], *v.get("aliases", [])}:
                      continue
                  line = f'{d["name"]}=={d["version"]} {v["id"]} fix: {v.get("fix_versions") or "none yet"}'
                  print(line)
                  if v.get("fix_versions"):
                      bad.append(line)
          sys.exit(1 if bad else 0)
          PY

  fail2ban:
    # deploy/fail2ban filters against real nginx combined-format lines, and the jail files parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fail2ban
        run: sudo apt-get update && sudo apt-get install -y fail2ban
      - name: Filters match probes and never normal traffic
        run: |
          set -eu
          sudo cp deploy/fail2ban/nginx-tabela-*.local /etc/fail2ban/filter.d/
          F=tests/fixtures/fail2ban
          # check <filter> <log> <must_match_all|must_match_none>
          check() {
            out=$(fail2ban-regex "$2" "$1" 2>&1) || { echo "$out"; exit 1; }
            line=$(echo "$out" | grep -E '^Lines: ' | head -1)
            echo "$1 on $2 -> $line"
            total=$(echo "$line" | sed -E 's/^Lines: ([0-9]+) lines.*/\1/')
            matched=$(echo "$line" | sed -E 's/.* ([0-9]+) matched.*/\1/')
            [ "$total" -gt 0 ]
            if [ "$3" = all ]; then [ "$matched" -eq "$total" ]; else [ "$matched" -eq 0 ]; fi
          }
          check nginx-tabela-probes $F/should_match_probes.log all
          check nginx-tabela-slow   $F/should_match.log all
          check nginx-tabela-probes $F/should_not_match.log none
          check nginx-tabela-slow   $F/should_not_match.log none
      - name: Jail files parse (fail2ban-client -t)
        run: |
          set -eu
          conf=$(mktemp -d)/fail2ban
          cp -r /etc/fail2ban "$conf"
          touch "$RUNNER_TEMP/access.log"
          cp deploy/fail2ban/nginx-tabela-*.local "$conf/filter.d/"
          cp deploy/fail2ban/jail.local "$conf/jail.local"
          sed "s#/var/log/nginx/access.log#$RUNNER_TEMP/access.log#" deploy/fail2ban/jail-tabela.local > "$conf/jail.d/jail-tabela.local"
          sudo fail2ban-client -c "$conf" -t
