# Installed as /etc/nginx/conf.d/tabela-limits.conf (http context).
limit_req_zone $binary_remote_addr zone=tabela_api:10m rate=10r/s;
# Rejected requests (429) are logged to error.log at this level, WITH the request line -
# for /api/follows that includes the push endpoint in the query string. "warn" keeps them
# out of the default "error" level; see README (Deploy > log-uri).
limit_req_log_level warn;
