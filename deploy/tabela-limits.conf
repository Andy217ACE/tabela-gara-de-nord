# Installed as /etc/nginx/conf.d/tabela-limits.conf (http context).
limit_req_zone $binary_remote_addr zone=tabela_api:10m rate=10r/s;
# Admin login (ADMIN_TOKEN): 5 attempts/min per IP; the app also answers 429 after 5 failures.
limit_req_zone $binary_remote_addr zone=tabela_admin_login:1m rate=5r/m;
# Rejected requests (429) are logged to error.log at this level, WITH the request line -
# for /api/follows that includes the push endpoint in the query string. "warn" keeps them
# out of the default "error" level; see README (Deploy > log-uri).
limit_req_log_level warn;
# Statistics / catalog / stations / journeys: computed over the whole history, 1 request/s
# per IP (burst 20 covers a page that loads a few of them at once).
limit_req_zone $binary_remote_addr zone=tabela_stats:10m rate=60r/m;
