# Site for Tabela Gara de Nord: /etc/nginx/sites-available/tabela (symlinked in sites-enabled).
# Official address: https://tabelagn.online. www.tabelagn.online and the old tabelacfr.ddns.net
# answer 301 to it with the same path (see docs/deploy-si-configurare.md, section 9.1).
# The "managed by Certbot" lines are the ones certbot wrote (one certificate per domain); keep them
# as they are (certbot renew only touches the files under /etc/letsencrypt).
# Requires /etc/nginx/conf.d/tabela-limits.conf (limit_req_zone tabela_api).
server {
    server_name tabelagn.online;

    client_max_body_size 8k;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json application/xml image/svg+xml;

    # The app sets CSP, nosniff, Referrer-Policy and X-Frame-Options; HSTS is TLS-level.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    limit_req_status 429;

    # The push endpoint is in the query string: never write it to the access log.
    location = /api/follows {
        access_log off;
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Admin login: strict rate limit (zone tabela_admin_login in tabela-limits.conf).
    location = /api/admin/login {
        limit_req zone=tabela_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Expensive aggregates (whole-history computations): stricter zone tabela_stats.
    location ~ ^/api/(stats|trains/stats|trains/[0-9]+/journeys|stations|journeys)(/|$) {
        limit_req zone=tabela_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tabelagn.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tabelagn.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www -> apex (the tabelagn.online certificate covers www too).
server {
    server_name www.tabelagn.online;
    server_tokens off;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tabelagn.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabelagn.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://tabelagn.online$request_uri;
}

# Old domain -> new domain, but only for page opens and clients without Sec-Fetch-Mode (crawlers):
# a PWA installed on the old origin keeps working (its API / sw.js fetches are cors/same-origin/no-cors
# and a cross-origin redirect would break them). The Search Console / Bing verification files stay
# served here (the "Change of address" tool needs the old site to remain verified).
map "$http_sec_fetch_mode|$uri" $tabela_old_redirect {
    default 1;
    ~^(cors|same-origin|no-cors)\| 0;
    ~\|/googled34693806887f80a\.html$ 0;
    ~\|/BingSiteAuth\.xml$ 0;
    ~\|/\.well-known/ 0;
}
server {
    server_name tabelacfr.ddns.net;
    server_tokens off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    if ($tabela_old_redirect) { return 301 https://tabelagn.online$request_uri; }

    location = /googled34693806887f80a.html {
        default_type text/html;
        return 200 "google-site-verification: googled34693806887f80a.html";
    }
    location = /BingSiteAuth.xml {
        default_type application/xml;
        return 200 "<?xml version=\"1.0\"?>
<users>
    <user>38816A1F8BFEA373A82D2EB6FE2E3043</user>
</users>
";
    }
    location = /api/follows {
        access_log off;
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/ {
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tabelacfr.ddns.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tabelacfr.ddns.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP for every name (and the LAN IPs) -> https://tabelagn.online, except the ACME
# challenge, so certbot can renew both certificates.
server {
    listen 80;
    listen [::]:80;
    server_name tabelagn.online www.tabelagn.online tabelacfr.ddns.net 192.168.1.150 192.168.1.149;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://tabelagn.online$request_uri;
    }
}
