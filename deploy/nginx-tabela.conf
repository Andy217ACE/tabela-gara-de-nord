# Site for Tabela Gara de Nord: /etc/nginx/sites-available/tabela (symlinked in sites-enabled).
# The "managed by Certbot" lines are the ones certbot wrote for tabelacfr.ddns.net; keep them
# as they are (certbot renew only touches the files under /etc/letsencrypt).
# Requires /etc/nginx/conf.d/tabela-limits.conf (limit_req_zone tabela_api).
server {
    server_name tabelacfr.ddns.net;

    client_max_body_size 8k;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # The app sets CSP, nosniff, Referrer-Policy and X-Frame-Options; HSTS is TLS-level.
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    limit_req_status 429;

    # The push endpoint is in the query string: never write it to the access log.
    location = /api/follows {
        access_log off;
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Admin login: strict rate limit (zone tabela_admin_login in tabela-limits.conf).
    location = /api/admin/login {
        limit_req zone=tabela_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Expensive aggregates (whole-history computations): stricter zone tabela_stats.
    location ~ ^/api/(stats|trains/stats|trains/[0-9]+/journeys|stations|journeys)(/|$) {
        limit_req zone=tabela_stats burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=tabela_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tabelacfr.ddns.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tabelacfr.ddns.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tabelacfr.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name tabelacfr.ddns.net;
    return 404; # managed by Certbot


}
